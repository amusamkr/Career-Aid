<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Recommendation System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Career Recommendation System</h1>

    <div class="tabs">
      <button id="loginTab" class="tab active">Login</button>
      <button id="registerTab" class="tab">Register</button>
    </div>

    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" required>
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
      <p><a href="forgot-password.html">Forgot password?</a></p>
      <button type="submit">Login</button>
      <p class="admin-login-link"><a href="#" id="forgotPasswordLink"></a></p>
    </form>

    <form id="registerForm" class="hidden">
  <input type="text" id="registerName" placeholder="Full Name" required>
  <input type="email" id="registerEmail" placeholder="Email" required>
  <select id="registerGender" required>
    <option value="">Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>
  <input type="password" id="registerPassword" placeholder="Password" required>
  <input type="password" id="registerConfirmPassword" placeholder="Confirm Password" required>
  <button type="submit">Register</button>
</form>

    <form id="forgotForm" class="hidden">
      <input type="email" id="forgotEmail" placeholder="Email" autocomplete="email" required>
      <button type="submit">Send Reset Link</button>
      <p class="admin-login-link"><a href="#" id="backToLoginLink">Back to login</a></p>
    </form>

    <p id="message" aria-live="polite"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
