<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Forgot Password</h1>

    <form id="forgotForm">
      <input type="email" id="email" placeholder="Your registered email" required>
      <button type="submit">Send Reset Link</button>
    </form>

   <div id="resetLinkBox" class="hidden">
  <p class="hint">Since email isn't set up yet, use this link directly:</p>
  <label for="resetLinkText" class="hint">Reset link</label>
  <input type="text" id="resetLinkText" readonly title="Password reset link">
  <button type="button" id="copyLinkBtn" class="secondary">Copy Link</button>
  <button type="button" id="goToLinkBtn">Open Reset Page</button>
</div>

    <p id="message"></p>
  <p class="back-link"><a href="index.html">← Back to Login</a></p>
  </div>

  <script src="forgot-password.js"></script>
</body>
</html>
